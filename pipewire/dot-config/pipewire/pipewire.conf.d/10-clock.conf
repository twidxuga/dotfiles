# Default graph rate stays at 48 kHz; PipeWire switches to the stream's native
# rate when it is in this list, so 44.1k/96k/192k material plays without resampling.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 352800 384000 ]
}
